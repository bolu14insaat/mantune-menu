<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { 
            /* Turkuaz Geçişli Arka Plan */
            --bg-gradient: linear-gradient(135deg, #00ced1 0%, #20b2aa 50%, #008080 100%);
            --red: #d90429;    /* Başlıklar için güçlü kırmızı */
            --black: #1a1a1a;  /* Metinler için derin siyah */
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient);
            background-attachment: fixed; /* Arka plan kaymaz, sabit kalır */
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* GÖRSELLER - Sabit ve Ön Planda */
        .bg-image {
            position: fixed;
            z-index: 1; 
            opacity: 1; 
            pointer-events: none;
            width: 500px; 
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        .img-left { bottom: -50px; left: -100px; transform: rotate(-10deg); }
        .img-right { top: 5%; right: -120px; transform: rotate(10deg); }

        /* YAZI ALANI - Boşlukta ve Siyah */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
            background: transparent; 
        }

        header { text-align: center; padding: 60px 0; }
        h1 { 
            color: var(--red); 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 3rem; 
            font-weight: 900;
        }
        .tagline { color: var(--black); font-style: italic; margin-top: 10px; font-size: 1.2rem; font-weight: 600; }
        
        .category-section { margin-top: 50px; }
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin-bottom: 35px;
            font-weight: 800;
            border-bottom: 2px solid var(--red);
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 30px; 
            padding: 5px 0;
            background: transparent; 
        }

        .item-info { flex: 1; padding-right: 20px; }
        .item-name { 
            font-weight: 700; 
            font-size: 1.3rem; 
            display: block; 
            color: var(--black); 
            margin-bottom: 4px;
        }
        .item-desc { 
            font-size: 1rem; 
            color: var(--black); 
            opacity: 0.8; 
            display: block; 
            font-weight: 500;
        }
        
        .item-price { 
            color: var(--black); 
            font-weight: 900; 
            font-size: 1.4rem; 
            white-space: nowrap; 
        }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.5rem; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: rgba(0,0,0,0.5); font-size: 0.9rem; font-weight: bold; }

        @media (max-width: 768px) {
            .bg-image { width: 320px; }
            .img-left { left: -80px; bottom: 0; }
            .img-right { right: -80px; top: 10%; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Yükleniyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => { renderMenu(results.data); }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Veri bağlantısı kurulamadı.';
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            const categories = {};
            
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    
                    // Fiyat kısmındaki her şeyi (150-250 dahil) olduğu gibi metin olarak çeker
                    let priceVal = item['Fiyat (TL)'];
                    if (priceVal === undefined || priceVal === null) priceVal = '';
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${priceVal}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }
        loadMenu();
    </script>
</body>
</html>
