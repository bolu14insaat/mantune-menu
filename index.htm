<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #0b0b0b; --card: #161616; --text: #f0f0f0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ARKA PLAN GÖRSELLERİ - Ekranda Sabit ve Büyük */
        .bg-image {
            position: fixed; /* Sayfayı kaydırsan da ekranda sabit kalır */
            z-index: -1; /* Menü yazılarının arkasında kalır */
            opacity: 0.5; /* Görünürlük seviyesi (Artırıldı) */
            pointer-events: none;
            width: 600px; /* Dev boyut */
            height: auto;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.8));
        }

        /* Sol Alt Köşedeki Mantı */
        .img-left {
            bottom: -100px;
            left: -150px;
            transform: rotate(-15deg);
        }

        /* Sağ Üst Köşedeki Gözleme */
        .img-right {
            top: 5%;
            right: -200px;
            transform: rotate(15deg);
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 1; 
            /* Yazıların resimlerin üstünde okunması için hafif karartma */
            background: rgba(11, 11, 11, 0.8);
            box-shadow: 0 0 100px rgba(0,0,0,1);
            min-height: 100vh;
        }

        header { text-align: center; padding: 60px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        h1 { color: var(--gold); letter-spacing: 8px; text-transform: uppercase; margin: 0; font-size: 2.5rem; }
        .tagline { color: #888; font-style: italic; margin-top: 15px; font-size: 1rem; }
        
        .category-section { margin-top: 50px; }
        .category-title { 
            color: var(--gold); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.5rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-title::before, .category-title::after {
            content: ""; flex: 1; height: 1px; background: #444; margin: 0 20px;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 25px; 
            padding-bottom: 15px;
            border-bottom: 1px solid #1a1a1a;
        }

        .item-info { flex: 1; padding-right: 20px; }
        .item-name { font-weight: 600; font-size: 1.15rem; display: block; color: var(--text); }
        .item-desc { font-size: 0.95rem; color: #999; margin-top: 5px; display: block; font-weight: 300; }
        .item-price { color: var(--gold); font-weight: 700; font-size: 1.25rem; white-space: nowrap; }

        #loading { text-align: center; margin-top: 150px; color: var(--gold); font-size: 1.3rem; }
        footer { text-align: center; padding: 60px; color: #444; font-size: 0.9rem; }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .bg-image { width: 350px; opacity: 0.4; }
            .img-left { left: -80px; bottom: -50px; }
            .img-right { right: -100px; top: 10%; }
            .container { padding: 15px; background: rgba(11, 11, 11, 0.85); }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error('Ağ hatası');
                const csvData = await response.text();
                
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        renderMenu(results.data);
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Menü yüklenirken bir sorun oluştu.';
                console.error(error);
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            
            const categories = {};
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    const price = item['Fiyat (TL)'] || '';
                    
                    if(!name) return;

                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${price}</div>
                        </div>`;
                });
                
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }

        loadMenu();
    </script>
</body>
</html>
