<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantune - Dijital Menü</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<style>

:root {
    --primary: #8b3a2b;
    --primary-dark: #5c2419;
    --black: #111111;
    --box-bg: rgba(255,248,240,0.78);
    --border-soft: rgba(139,58,43,0.18);
    --shadow: 0 10px 24px rgba(0,0,0,0.08);
    --shadow-strong: 0 16px 34px rgba(0,0,0,0.10);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    background-image: url('arkaplan.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: #f7efe5;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: var(--black);
}

/* ARKA PLAN GÖRSELLERİ */

.bg-image {
    position: fixed;
    z-index: 1;
    opacity: 0.92;
    pointer-events: none;
    width: 420px;
    height: auto;
}

.img-left {
    bottom: -40px;
    left: -70px;
    transform: rotate(-5deg);
}

.img-right {
    top: 10%;
    right: -90px;
    transform: rotate(5deg);
}

/* STICKY TOP BAR */

.top-sticky-bar {
    position: sticky;
    top: 0;
    z-index: 999;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 18px;
    backdrop-filter: blur(14px);
    background: rgba(0,0,0,0.18);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo-center-area {
    display: flex;
    justify-content: center;
    align-items: center;
}

.sticky-logo {
    width: 95px;
    height: auto;
    object-fit: contain;
    filter:
        drop-shadow(0 6px 14px rgba(0,0,0,0.40))
        brightness(1.08);
}

/* DİL SEÇİCİ */

.lang-area {
    display: flex;
    justify-content: flex-end;
}

.lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 5px;
    backdrop-filter: blur(8px);
}

.lang-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: #fff;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: 0.2s ease;
}

.lang-btn.active {
    background: rgba(255,255,255,0.18);
    color: #fff;
}

.flag-img {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    object-fit: cover;
}

/* CONTAINER */

.container {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 18px 42px;
    position: relative;
    z-index: 10;
}

/* HEADER */

header {
    text-align: center;
    padding: 22px 0 16px;
}

.brand-name {
    font-family: 'Italiana', serif;
    color: var(--primary);
    letter-spacing: 0.42rem;
    text-transform: uppercase;
    margin: 0;
    font-size: 3.2rem;
    line-height: 0.95;
    font-weight: 400;
}

.brand-divider {
    width: 132px;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--primary), transparent);
    border-radius: 999px;
    margin: 14px auto;
}

.brand-sub {
    font-family: 'Cormorant Garamond', serif;
    color: var(--primary-dark);
    font-size: 1.05rem;
    letter-spacing: 0.30rem;
    text-transform: uppercase;
}

/* CATEGORY NAV */

.tabs-wrap {
    position: sticky;
    top: 82px;
    z-index: 50;
    margin: 6px 0 10px;
}

.tabs-shell {
    background: rgba(255,255,255,0.88);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 8px;
    box-shadow: var(--shadow);
}

.quick-nav {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scrollbar-width: none;
}

.quick-nav::-webkit-scrollbar {
    display: none;
}

.quick-chip {
    flex: 0 0 auto;
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.78);
    color: var(--primary-dark);
    text-decoration: none;
    font-size: 0.90rem;
    font-weight: 600;
    border: 1px solid rgba(139,58,43,0.10);
}

.quick-chip.active {
    background: var(--primary);
    color: #fff;
}

/* LOADING */

#loading {
    text-align: center;
    margin-top: 110px;
    color: var(--primary);
    font-size: 1.08rem;
    font-weight: 700;
}

/* MENU */

.category-section {
    margin-top: 42px;
}

.category-title {
    color: var(--primary);
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    margin-bottom: 24px;
    border-bottom: 1px solid rgba(139,58,43,0.25);
    padding-bottom: 10px;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    background: var(--box-bg);
    padding: 18px;
    border-radius: 10px;
    border-left: 4px solid var(--primary);
    box-shadow: var(--shadow);
}

.item-info {
    flex: 1;
}

.item-name {
    font-weight: 700;
    font-size: 1.08rem;
    display: block;
    margin-bottom: 6px;
}

.item-desc {
    font-size: 0.95rem;
    color: rgba(17,17,17,0.75);
    line-height: 1.5;
}

.item-price {
    color: var(--primary-dark);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: 1.45rem;
    text-align: right;
    min-width: 90px;
}

footer {
    text-align: center;
    padding: 54px 20px 20px;
    color: rgba(0,0,0,0.55);
    font-size: 0.86rem;
}

/* MOBİL */

@media (max-width: 768px) {

    body {
        background-attachment: scroll;
    }

    .container {
        padding: 14px 14px 34px;
    }

    /* GÖRSELLER KÜÇÜLDÜ */

    .bg-image {
        width: 210px;
        opacity: 0.82;
    }

    .img-left {
        bottom: -10px;
        left: -70px;
    }

    .img-right {
        top: 8%;
        right: -65px;
    }

    .top-sticky-bar {
        padding: 10px 12px;
    }

    .sticky-logo {
        width: 78px;
    }

    .lang-btn {
        padding: 7px 10px;
        font-size: 0.8rem;
    }

    .brand-name {
        font-size: 2.5rem;
        letter-spacing: 0.18rem;
    }

    .brand-sub {
        font-size: 0.82rem;
        letter-spacing: 0.14rem;
        text-align: center;
    }

    .menu-item {
        padding: 15px;
    }

    .item-price {
        min-width: 70px;
        font-size: 1.15rem;
    }
}

</style>
</head>

<body>

<!-- ARKA PLAN GÖRSELLERİ -->

<img src="manti.png" class="bg-image img-left" alt="Mantı" />
<img src="gozleme.png" class="bg-image img-right" alt="Gözleme" />

<!-- STICKY TOP BAR -->

<div class="top-sticky-bar">

    <div></div>

    <div class="logo-center-area">
        <img
            class="sticky-logo"
            src="mantunelogo.png"
            alt="Mantune Logo"
        />
    </div>

    <div class="lang-area">

        <div class="lang-switch">

            <button id="btn-tr" class="lang-btn active" onclick="setLang('tr')">

                <img
                    class="flag-img"
                    src="https://flagcdn.com/w40/tr.png"
                    alt="TR"
                />

                TR

            </button>

            <button id="btn-en" class="lang-btn" onclick="setLang('en')">

                <img
                    class="flag-img"
                    src="https://flagcdn.com/w40/gb.png"
                    alt="EN"
                />

                EN

            </button>

        </div>

    </div>

</div>

<div class="container">

<header>

    <h1 class="brand-name" id="main-title">MANTUNE</h1>

    <div class="brand-divider"></div>

    <div class="brand-sub" id="main-tagline">
        Bolu'nun Geleneksel Lezzeti
    </div>

</header>

<div class="tabs-wrap">
    <div class="tabs-shell">
        <div id="quick-nav" class="quick-nav"></div>
    </div>
</div>

<div id="loading">Menü Yükleniyor...</div>

<div id="menu-content"></div>

<footer>
    &copy; 2026 Mantune Bolu.
</footer>

</div>

<script>

const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

let currentLang = localStorage.getItem('mantune_lang') || 'tr';
let menuData = [];

function cleanValue(value) {
    if (value === undefined || value === null) return '';
    return String(value).trim();
}

function slugify(text) {
    return String(text || '')
        .toLowerCase()
        .replace(/\s+/g, '-');
}

function getLocalizedValue(item, trKey, enKey) {

    const trValue = cleanValue(item[trKey]);
    const enValue = cleanValue(item[enKey]);

    if (currentLang === 'en') {
        return enValue || trValue || '';
    }

    return trValue || enValue || '';
}

function getLocalizedCategory(item) {
    return getLocalizedValue(item, 'Menü Kategorisi', 'Menu Category EN');
}

function getLocalizedName(item) {
    return getLocalizedValue(item, 'Ürün Adı', 'Product Name EN');
}

function getLocalizedDescription(item) {
    return getLocalizedValue(item, 'Açıklama', 'Description EN');
}

function getLocalizedPrice(item) {
    return getLocalizedValue(item, 'Fiyat (TL)', 'Price (TL)');
}

function updateStaticTexts() {

    const loading = document.getElementById('loading');

    if (currentLang === 'en') {

        document.getElementById('main-tagline').textContent =
            'Traditional Taste of Bolu';

        if (loading.style.display !== 'none') {
            loading.textContent = 'Loading menu...';
        }

    } else {

        document.getElementById('main-tagline').textContent =
            "Bolu'nun Geleneksel Lezzeti";

        if (loading.style.display !== 'none') {
            loading.textContent = 'Menü Yükleniyor...';
        }
    }

    document.getElementById('btn-tr')
        .classList.toggle('active', currentLang === 'tr');

    document.getElementById('btn-en')
        .classList.toggle('active', currentLang === 'en');
}

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('mantune_lang', lang);
    updateStaticTexts();
    renderMenu(menuData);
}

async function loadMenu() {

    try {

        updateStaticTexts();

        const response = await fetch(sheetUrl);
        const csvData = await response.text();

        Papa.parse(csvData, {

            header: true,
            skipEmptyLines: true,

            complete: (results) => {

                menuData = results.data || [];
                renderMenu(menuData);

            }

        });

    } catch (error) {

        document.getElementById('loading').textContent =
            'Veri bağlantı hatası';

    }
}

function renderQuickNav(categories) {

    const nav = document.getElementById('quick-nav');

    nav.innerHTML = categories.map((category, index) => {

        const id = 'cat-' + slugify(category);

        return `
            <a
                class="quick-chip ${index === 0 ? 'active' : ''}"
                href="#${id}">
                ${category}
            </a>
        `;

    }).join('');
}

function renderMenu(data) {

    const content = document.getElementById('menu-content');
    document.getElementById('loading').style.display = 'none';

    const categories = {};
    const categoryOrder = [];

    data.forEach(item => {

        const category = getLocalizedCategory(item);
        const name = getLocalizedName(item);

        if (!category || !name) return;

        if (!categories[category]) {

            categories[category] = [];
            categoryOrder.push(category);

        }

        categories[category].push(item);

    });

    renderQuickNav(categoryOrder);

    let html = '';

    categoryOrder.forEach(category => {

        const id = 'cat-' + slugify(category);

        html += `
            <section class="category-section" id="${id}">
                <h2 class="category-title">${category}</h2>
                <div class="menu-list">
        `;

        categories[category].forEach(item => {

            html += `
                <article class="menu-item">

                    <div class="item-info">

                        <span class="item-name">
                            ${getLocalizedName(item)}
                        </span>

                        <span class="item-desc">
                            ${getLocalizedDescription(item)}
                        </span>

                    </div>

                    <div class="item-price">
                        ${getLocalizedPrice(item)}
                    </div>

                </article>
            `;

        });

        html += `
                </div>
            </section>
        `;

    });

    content.innerHTML = html;
}

updateStaticTexts();
loadMenu();

</script>

</body>
</html>
