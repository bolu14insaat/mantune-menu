<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
        }
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }
        .category-link {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            background-color: #333333;
            border-radius: 20px;
            white-space: nowrap;
        }
        .category-link.active {
            background-color: #ffcc00;
            color: #000000;
        }
        .menu-container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .category-section {
            margin-bottom: 40px;
        }
        .category-title {
            font-size: 22px;
            color: #ffcc00;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .menu-item {
            background-color: #1f1f1f;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-details {
            flex: 1;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
        }
        .item-desc {
            font-size: 14px;
            color: #aaaaaa;
            margin-top: 5px;
        }
        .item-price {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            margin-left: 20px;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MANTUNE</div>
        <div class="category-nav" id="categoryNav"></div>
    </header>

    <main class="menu-container" id="menuContainer">
        <div class="loading">Menü yükleniyor...</div>
    </main>

    <script>
        const SPREADSHEET_URL = 'https://script.google.com/macros/s/AKfycbwqZ-7AOn7NdfvOWe0GidFq_uJt7vXQ9M6CunX3O2Zco63W9vU02D8B-h9k4gqEon_I/exec';

        async function fetchMenu() {
            try {
                const response = await fetch(SPREADSHEET_URL);
                const data = await response.json();
                renderMenu(data);
            } catch (error) {
                console.error('Hata:', error);
                document.getElementById('menuContainer').innerHTML = '<div class="loading">Menü yüklenemedi.</div>';
            }
        }

        function renderMenu(data) {
            const menuContainer = document.getElementById('menuContainer');
            const categoryNav = document.getElementById('categoryNav');
            
            menuContainer.innerHTML = '';
            categoryNav.innerHTML = '';

            const categories = [...new Set(data.map(item => item["Menü Kategorisi"]))];

            categories.forEach((category, index) => {
                const navLink = document.createElement('a');
                navLink.href = `#cat-${index}`;
                navLink.className = 'category-link';
                if (index === 0) navLink.className += ' active';
                navLink.innerText = category;
                categoryNav.appendChild(navLink);

                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = `cat-${index}`;

                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = category;
                section.appendChild(title);

                const items = data.filter(item => item["Menü Kategorisi"] === category);
                items.forEach(item => {
                    const menuItem = document.createElement('div');
                    menuItem.className = 'menu-item';

                    const details = document.createElement('div');
                    details.className = 'item-details';

                    const name = document.createElement('div');
                    name.className = 'item-name';
                    name.innerText = item["Ürün Adı"];
                    details.appendChild(name);

                    if (item["Açıklama"]) {
                        const desc = document.createElement('div');
                        desc.className = 'item-desc';
                        desc.innerText = item["Açıklama"];
                        details.appendChild(desc);
                    }

                    const price = document.createElement('div');
                    price.className = 'item-price';
                    price.innerText = item["Fiyat (TL)"] + ' TL';

                    menuItem.appendChild(details);
                    menuItem.appendChild(price);
                    section.appendChild(menuItem);
                });

                menuContainer.appendChild(section);
            });

            const links = document.querySelectorAll('.category-link');
            links.forEach(link => {
                link.addEventListener('click', function() {
                    document.querySelector('.category-link.active').classList.remove('active');
                    this.classList.add('active');
                });
            });
        }

        fetchMenu();
    </script>
</body>
</html>
