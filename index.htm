<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --gold: #c5a059; --bg: #0b0b0b; --card: #161616; --text: #f0f0f0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        /* DEKORATİF GÖRSELLER - Kenarlara sabitleme */
        .bg-image {
            position: fixed;
            z-index: -1; /* İçeriğin arkasında kalması için */
            opacity: 0.2; /* Gözü yormaması için hafif saydam */
            pointer-events: none; /* Üzerine tıklanmasın */
            width: 250px; /* Görsel boyutu */
            filter: grayscale(30%) sepia(20%); /* Altın temasına uygun tonlama */
        }

        .img-left {
            bottom: -20px;
            left: -50px;
            transform: rotate(-15deg);
        }

        .img-right {
            top: 20%;
            right: -60px;
            transform: rotate(15deg);
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 1; 
        }

        header { text-align: center; padding: 40px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
        h1 { color: var(--gold); letter-spacing: 6px; text-transform: uppercase; margin: 0; font-size: 2.2rem; }
        .tagline { color: #888; font-style: italic; margin-top: 10px; font-size: 0.9rem; }
        
        .category-section { margin-top: 40px; }
        .category-title { 
            color: var(--gold); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-title::before, .category-title::after {
            content: ""; flex: 1; height: 1px; background: #333; margin: 0 15px;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            padding-bottom: 10px;
        }

        .item-info { flex: 1; padding-right: 20px; }
        .item-name { font-weight: 600; font-size: 1.05rem; display: block; color: var(--text); }
        .item-desc { font-size: 0.85rem; color: #999; margin-top: 4px; display: block; font-weight: 300; }
        .item-price { color: var(--gold); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }

        #loading { text-align: center; margin-top: 100px; color: var(--gold); font-size: 1.2rem; }
        footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }

        /* Mobilde resimlerin içeriği kapatmaması için boyut küçültme */
        @media (max-width: 768px) {
            .bg-image { width: 150px; opacity: 0.15; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="">
    <img src="gozleme.png" class="bg-image img-right" alt="">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Yükleniyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error('Ağ hatası');
                const csvData = await response.text();
                
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        renderMenu(results.data);
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Menü şu an yüklenemiyor.';
                console.error(error);
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            
            const categories = {};
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    const price = item['Fiyat (TL)'] || '';
                    
                    if(!name) return;

                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${price}</div>
                        </div>`;
                });
                
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }

        loadMenu();
    </script>
</body>
</html>
