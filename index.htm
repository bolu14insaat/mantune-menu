<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantune - Dijital Menü</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --primary: #8b3a2b;
            --primary-dark: #5c2419;
            --black: #111111;
            --box-bg: rgba(255,248,240,0.78);
            --border-soft: rgba(139,58,43,0.18);
            --shadow: 0 10px 24px rgba(0,0,0,0.08);
            --shadow-strong: 0 16px 34px rgba(0,0,0,0.10);
            --sticky-offset: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('arkaplan.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f7efe5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--black);
        }

        /* ARKA PLAN GÖRSELLERİ */

        .bg-image {
            position: fixed;
            z-index: 1;
            opacity: 0.95;
            pointer-events: none;
            width: 420px;
            height: auto;
            transition: 0.3s ease;
        }

        .img-left {
            bottom: -40px;
            left: -70px;
            transform: rotate(-5deg);
        }

        .img-right {
            top: 10%;
            right: -90px;
            transform: rotate(5deg);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 18px 42px;
            position: relative;
            z-index: 10;
        }

        /* STICKY ÜST BAR */

        .top-sticky-bar {
            position: sticky;
            top: 0;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            backdrop-filter: blur(14px);
            background: rgba(0,0,0,0.18);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .sticky-logo {
            width: 88px;
            height: auto;
            object-fit: contain;
            filter:
                drop-shadow(0 6px 14px rgba(0,0,0,0.40))
                brightness(1.08);
        }

        /* DİL SEÇİCİ */

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            padding: 5px;
            backdrop-filter: blur(8px);
        }

        .lang-btn {
            appearance: none;
            border: none;
            background: transparent;
            color: #fff;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s ease;
        }

        .lang-btn.active {
            background: rgba(255,255,255,0.18);
            color: #fff;
        }

        .flag-img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* HEADER */

        header {
            text-align: center;
            padding: 20px 0 22px;
        }

        .logo-wrap {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px 26px 12px;
        }

        .brand-name {
            font-family: 'Italiana', serif;
            color: var(--primary);
            letter-spacing: 0.42rem;
            text-transform: uppercase;
            margin: 0;
            font-size: 3.4rem;
            line-height: 0.95;
            font-weight: 400;
        }

        .brand-divider {
            width: 132px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            border-radius: 999px;
        }

        .brand-sub {
            font-family: 'Cormorant Garamond', serif;
            color: var(--primary-dark);
            font-size: 1.05rem;
            letter-spacing: 0.30rem;
            text-transform: uppercase;
            margin-top: -2px;
        }

        /* KATEGORİLER */

        .tabs-wrap {
            position: sticky;
            top: 78px;
            z-index: 50;
            margin: 6px 0 10px;
        }

        .tabs-shell {
            background: rgba(255,255,255,0.88);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 8px;
            box-shadow: var(--shadow);
        }

        .quick-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .quick-nav::-webkit-scrollbar {
            display: none;
        }

        .quick-chip {
            flex: 0 0 auto;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255,255,255,0.78);
            color: var(--primary-dark);
            text-decoration: none;
            font-size: 0.90rem;
            font-weight: 600;
            border: 1px solid rgba(139,58,43,0.10);
        }

        .quick-chip.active {
            background: var(--primary);
            color: #fff;
        }

        /* LOADING */

        #loading {
            text-align: center;
            margin-top: 110px;
            color: var(--primary);
            font-size: 1.08rem;
            font-weight: 700;
        }

        /* MENU */

        .category-section {
            margin-top: 42px;
        }

        .category-title {
            color: var(--primary);
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(139,58,43,0.25);
            padding-bottom: 10px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            background: var(--box-bg);
            padding: 18px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.08rem;
            display: block;
            margin-bottom: 6px;
        }

        .item-desc {
            font-size: 0.95rem;
            color: rgba(17,17,17,0.75);
            line-height: 1.5;
        }

        .item-price {
            color: var(--primary-dark);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 1.45rem;
            text-align: right;
            min-width: 90px;
        }

        footer {
            text-align: center;
            padding: 54px 20px 20px;
            color: rgba(0,0,0,0.55);
            font-size: 0.86rem;
        }

        /* MOBİL */

        @media (max-width: 768px) {

            body {
                background-attachment: scroll;
            }

            .container {
                padding: 14px 14px 34px;
            }

            /* MOBİLDE GÖRSELLER KÜÇÜLDÜ */

            .bg-image {
                width: 210px;
                opacity: 0.82;
            }

            .img-left {
                bottom: -10px;
                left: -70px;
            }

            .img-right {
                top: 8%;
                right: -65px;
            }

            .top-sticky-bar {
                padding: 10px 12px;
            }

            .sticky-logo {
                width: 68px;
            }

            .lang-btn {
                padding: 7px 10px;
                font-size: 0.8rem;
            }

            .brand-name {
                font-size: 2.5rem;
                letter-spacing: 0.18rem;
            }

            .brand-sub {
                font-size: 0.82rem;
                letter-spacing: 0.14rem;
                text-align: center;
            }

            .menu-item {
                padding: 15px;
            }

            .item-price {
                min-width: 70px;
                font-size: 1.15rem;
            }
        }

    </style>
</head>

<body>

    <!-- ARKA PLAN GÖRSELLERİ -->

    <img src="manti.png" class="bg-image img-left" alt="Mantı" />
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme" />

    <!-- STICKY ÜST BAR -->

    <div class="top-sticky-bar">

        <img
            class="sticky-logo"
            src="mantunelogo.png"
            alt="Mantune Logo"
        />

        <div class="lang-switch">

            <button id="btn-tr" class="lang-btn active" onclick="setLang('tr')">

                <img
                    class="flag-img"
                    src="https://flagcdn.com/w40/tr.png"
                    alt="TR"
                />

                TR

            </button>

            <button id="btn-en" class="lang-btn" onclick="setLang('en')">

                <img
                    class="flag-img"
                    src="https://flagcdn.com/w40/gb.png"
                    alt="EN"
                />

                EN

            </button>

        </div>

    </div>

</body>
</html>
