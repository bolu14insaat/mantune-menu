<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantune Menü</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; }
.container { max-width:700px; margin:auto; padding:20px; }
.topbar { text-align:right; margin-bottom:20px; }
button { padding:6px 12px; cursor:pointer; }
.category { margin-top:30px; }
.item { display:flex; justify-content:space-between; margin:10px 0; }
</style>
</head>

<body>
<div class="container">

<div class="topbar">
<button onclick="setLang('tr')">TR</button>
<button onclick="setLang('en')">EN</button>
</div>

<div id="menu"></div>

</div>

<script>
let lang = 'tr';

const sheetUrl = 'SHEET_LINK_BURAYA';

function setLang(l){
    lang = l;
    loadMenu();
}

function getField(item, tr, en){
    if(lang === 'en'){
        return item[en] || item[tr] || '';
    }
    return item[tr] || '';
}

async function loadMenu(){
    const res = await fetch(sheetUrl);
    const csv = await res.text();

    Papa.parse(csv, {
        header:true,
        complete:(results)=>{
            render(results.data);
        }
    });
}

function render(data){
    const menu = document.getElementById('menu');
    let html = '';

    const categories = {};

    data.forEach(i=>{
        const cat = getField(i,'Menü Kategorisi','Menü Kategorisi EN');
        if(!categories[cat]) categories[cat]=[];
        categories[cat].push(i);
    });

    for(const cat in categories){
        html += `<div class="category"><h2>${cat}</h2>`;

        categories[cat].forEach(i=>{
            const name = getField(i,'Ürün Adı','Ürün Adı EN');
            const desc = getField(i,'Açıklama','Açıklama EN');
            const price = getField(i,'Fiyat Yazısı','Fiyat Yazısı EN');

            html += `
            <div class="item">
                <div>
                    <b>${name}</b><br>
                    <small>${desc}</small>
                </div>
                <div>${price}</div>
            </div>`;
        });

        html += `</div>`;
    }

    menu.innerHTML = html;
}

loadMenu();
</script>
</body>
</html>
