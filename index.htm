<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Open+Sans:wght@400;600;700&family=Damion&display=swap" rel="stylesheet">

    <style>
        :root { 
            --red: #a33;        /* Kategori Başlıkları */
            --black: #000000;    /* Metinler */
            --off-white: #ffffff; /* Ana Başlık */
            /* YENİ: Yazı kutuları için daha opak, sütlü bej tonu */
            --box-bg: rgba(245, 240, 230, 0.85); 
        }
        
        body { 
            font-family: 'Open Sans', sans-serif; 
            background-image: url('arkaplan.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f1ebd8; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            z-index: 1; 
            opacity: 1; 
            pointer-events: none;
            width: 480px; 
            height: auto;
            filter: drop-shadow(0 8px 25px rgba(0,0,0,0.15));
        }

        .img-left { bottom: -70px; left: -90px; transform: rotate(-8deg); }
        .img-right { top: 6%; right: -110px; transform: rotate(8deg); }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
        }

        header { text-align: center; padding: 70px 0; }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            color: var(--off-white); 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 5.5rem; 
            font-weight: 900;
            /* Başlığı daha gösterişli yapan derin gölge */
            text-shadow: 2px 4px 15px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.2); 
        }

        .tagline { 
            color: var(--black); 
            font-style: italic; 
            margin-top: 15px; 
            font-size: 1.3rem; 
            font-weight: 700; 
        }
        
        .category-section { margin-top: 60px; }
        
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 800;
            border-bottom: 3px solid var(--red);
            display: block;
            padding-bottom: 15px;
        }

        /* GÜNCELLEME: Blur kaldırıldı, opaklık artırıldı */
        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 20px; 
            background: var(--box-bg); /* Daha opak bej arka plan */
            padding: 22px;
            border-radius: 12px;
            backdrop-filter: none; /* Blur TAMAMEN KALDIRILDI */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border: 1px solid rgba(0,0,0,0.05);
        }

        .item-info { flex: 1; padding-right: 25px; }
        
        .item-name { 
            font-family: 'Playfair Display', serif;
            font-weight: 700; 
            font-size: 1.45rem; 
            display: block; 
            color: var(--black); 
            margin-bottom: 6px; 
        }
        
        .item-desc { 
            font-family: 'Damion', cursive; 
            font-size: 1.25rem; 
            color: var(--black); 
            display: block; 
            font-weight: 400;
            line-height: 1.4;
        }
        
        .item-price { 
            color: var(--black); 
            font-weight: 900; 
            font-size: 1.6rem; 
            white-space: nowrap; 
        }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.6rem; font-weight: bold; }
        footer { text-align: center; padding: 70px; color: rgba(0,0,0,0.5); font-size: 1rem; font-weight: 700; }

        @media (max-width: 768px) {
            .bg-image { width: 320px; }
            .img-left { left: -80px; bottom: -10px; }
            .img-right { right: -90px; top: 10%; }
            h1 { font-size: 3.2rem; letter-spacing: 6px; }
            .menu-item { flex-direction: column; padding: 18px; }
            .item-price { margin-top: 12px; }
            body { background-attachment: scroll; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => { renderMenu(results.data); }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Bağlantı Hatası.';
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            const categories = {};
            
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    let priceVal = item['Fiyat (TL)'] || '---';
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${priceVal}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }
        loadMenu();
    </script>
</body>
</html>
