<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantune - Dijital Menü</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<style>
/* SADECE GÖRSEL İÇİN EK */
.item-image {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
}

.item-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* mevcut yapı korunuyor */
.menu-item {
    display: flex;
    gap: 12px;
    align-items: center;
}
</style>
</head>

<body>

<div id="loading">Menü Yükleniyor...</div>
<div id="menu-content"></div>

<script>

const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

let menuData = [];

function cleanValue(value) {
    if (!value) return '';
    return String(value).trim();
}

function loadMenu() {
    fetch(sheetUrl)
    .then(res => res.text())
    .then(csv => {
        Papa.parse(csv, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                menuData = results.data;
                renderMenu(menuData);
            }
        });
    });
}

function renderMenu(data) {

    const content = document.getElementById('menu-content');
    document.getElementById('loading').style.display = 'none';

    let html = '';

    data.forEach(item => {

        const name = cleanValue(item['Ürün Adı']);
        const desc = cleanValue(item['Açıklama']);
        const price = cleanValue(item['Fiyat (TL)']);
        const image = cleanValue(item['Görsel URL']); // YENİ

        if (!name) return;

        html += `
        <div class="menu-item">

            ${image ? `
            <div class="item-image">
                <img src="${image}" alt="${name}">
            </div>
            ` : ''}

            <div class="item-info">
                <div class="item-name">${name}</div>
                ${desc ? `<div class="item-desc">${desc}</div>` : ''}
            </div>

            <div class="item-price">${price}</div>

        </div>
        `;
    });

    content.innerHTML = html;
}

loadMenu();

</script>

</body>
</html>
