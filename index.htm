<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700&family=Marck+Script&display=swap" rel="stylesheet">

    <style>
        :root { 
            --red: #a33;        
            --black: #000000;    
            --gold: #8c734b;
            /* Renk tonu aynı, sadece daha şeffaf (0.85'ten 0.5'e çekildi) */
            --box-bg: rgba(245, 240, 230, 0.5); 
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-image: url('arkaplan.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f1ebd8; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            z-index: 1; 
            opacity: 1; 
            pointer-events: none;
            width: 450px; 
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        .img-left { bottom: -50px; left: -80px; transform: rotate(-5deg); }
        .img-right { top: 8%; right: -100px; transform: rotate(5deg); }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
        }

        header { text-align: center; padding: 60px 0; }
        
        /* Yeni Modern & Zarif Başlık Tasarımı */
        h1 { 
            font-family: 'Cinzel', serif;
            color: var(--black); 
            letter-spacing: 15px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 4rem; 
            font-weight: 900;
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 2px;
            background: var(--red);
        }

        .tagline { 
            color: var(--red); 
            font-style: normal; 
            margin-top: 15px; 
            font-size: 1.1rem; 
            font-weight: 700; 
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .category-section { margin-top: 50px; }
        
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 5px;
            font-size: 1.8rem;
            margin-bottom: 35px;
            font-weight: 800;
            display: block;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 15px; 
            background: var(--box-bg); 
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: none; 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .item-info { flex: 1; padding-right: 20px; }
        
        .item-name { 
            font-weight: 700; 
            font-size: 1.3rem; 
            display: block; 
            color: var(--black); 
            margin-bottom: 5px; 
            text-transform: uppercase;
        }
        
        /* Yeni Daha Okunaklı El Yazısı Fontu */
        .item-desc { 
            font-family: 'Marck Script', cursive; 
            font-size: 1.4rem; 
            color: #333; 
            display: block; 
            font-weight: 400;
            line-height: 1.2;
        }
        
        .item-price { 
            color: var(--black); 
            font-weight: 900; 
            font-size: 1.5rem; 
            white-space: nowrap; 
        }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.4rem; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: rgba(0,0,0,0.4); font-size: 0.9rem; font-weight: 700; }

        @media (max-width: 768px) {
            .bg-image { width: 300px; }
            h1 { font-size: 2.2rem; letter-spacing: 8px; }
            .menu-item { padding: 15px; }
            body { background-attachment: scroll; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="manti.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mutfak Sanatı • Bolu</div>
        </header>
        
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => { renderMenu(results.data); }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Veri çekilemedi.';
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            const categories = {};
            
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    let priceVal = item['Fiyat (TL)'] || '---';
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${priceVal}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }
        loadMenu();
    </script>
</body>
</html>
