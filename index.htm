<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* RENK PALETİ GÜNCELLEMESİ */
        :root { 
            --bg: #000000; 
            --red: #e63946;    /* Başlıklar için canlı kırmızı */
            --yellow: #ffca3a; /* Ürünler ve açıklamalar için sarı */
            --price: #ffffff;  /* Fiyatlar için beyaz */
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--yellow); 
            margin: 0; 
            padding: 0; 
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* GÖRSELLER - Tam Ön Planda ve Net */
        .bg-image {
            position: fixed;
            z-index: -1; 
            opacity: 0.9; /* Neredeyse tam net */
            pointer-events: none;
            width: 550px; 
            height: auto;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.9));
        }

        .img-left { bottom: -50px; left: -120px; transform: rotate(-10deg); }
        .img-right { top: 5%; right: -150px; transform: rotate(10deg); }

        /* YAZI ALANI - Şeffaf Cam Efekti */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 30px; 
            position: relative; 
            z-index: 1; 
            /* Arka planı biraz şeffaf yapıyoruz ki resimler alttan görünsün */
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(5px); /* Hafif bulanıklık ile daha profesyonel durur */
            box-shadow: 0 0 80px rgba(0,0,0,1);
            min-height: 100vh;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        header { text-align: center; padding: 50px 0; border-bottom: 2px solid var(--red); margin-bottom: 30px; }
        h1 { color: var(--red); letter-spacing: 8px; text-transform: uppercase; margin: 0; font-size: 2.8rem; font-weight: 900; }
        .tagline { color: var(--yellow); opacity: 0.8; font-style: italic; margin-top: 10px; font-size: 1.1rem; }
        
        .category-section { margin-top: 50px; }
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            font-size: 1.6rem;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
        .category-title::before, .category-title::after {
            content: ""; flex: 1; height: 2px; background: var(--red); margin: 0 15px;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 30px; 
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(230, 57, 70, 0.2); /* Kırmızımsı ayırıcı */
        }

        .item-info { flex: 1; padding-right: 20px; }
        /* Ürün ve Açıklama Sarı */
        .item-name { font-weight: 700; font-size: 1.2rem; display: block; color: var(--yellow); margin-bottom: 4px; }
        .item-desc { font-size: 0.95rem; color: var(--yellow); opacity: 0.7; display: block; font-weight: 400; }
        
        /* Fiyat Beyaz (Daha kolay okunması için) */
        .item-price { color: #ffffff; font-weight: 800; font-size: 1.3rem; white-space: nowrap; }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.5rem; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: #666; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .bg-image { width: 380px; opacity: 0.8; }
            .img-left { left: -100px; bottom: -20px; }
            .img-right { right: -120px; top: 10%; }
            .container { padding: 20px; background: rgba(0, 0, 0, 0.82); }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error('Ağ hatası');
                const csvData = await response.text();
                
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        renderMenu(results.data);
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Veri çekilemedi.';
                console.error(error);
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            
            const categories = {};
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    const price = item['Fiyat (TL)'] || '';
                    
                    if(!name) return;

                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${price}</div>
                        </div>`;
                });
                
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }

        loadMenu();
    </script>
</body>
</html>
