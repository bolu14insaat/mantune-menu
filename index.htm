<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { 
            --red: #d90429;    
            --black: #000000;  /* Tam siyah yaptık */
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-image: url('arkaplan.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #00ced1;
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ÖN PLANDAKİ GÖRSELLER */
        .bg-image {
            position: fixed;
            z-index: 1; 
            opacity: 1; 
            pointer-events: none;
            width: 500px; 
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
        }

        .img-left { bottom: -60px; left: -100px; transform: rotate(-10deg); }
        .img-right { top: 7%; right: -120px; transform: rotate(10deg); }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
            background: transparent; 
        }

        header { text-align: center; padding: 60px 0; }
        h1 { 
            color: var(--red); 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 3rem; 
            font-weight: 900;
        }
        .tagline { color: var(--black); font-style: italic; margin-top: 10px; font-size: 1.2rem; font-weight: 700; }
        
        .category-section { margin-top: 50px; }
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin-bottom: 35px;
            font-weight: 800;
            border-bottom: 3px solid var(--red);
            display: block;
            padding-bottom: 10px;
        }

        /* YENİ GÜNCELLEME: Blur kalktı, daha koyu gölgelendirme geldi */
        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            margin-bottom: 15px; 
            /* Arka planı hafif karartıyoruz (Siyahın %30 şeffaf hali) */
            background: rgba(0, 0, 0, 0.12); 
            padding: 15px;
            border-radius: 10px;
            /* Bulanıklığı (blur) sildik */
            backdrop-filter: none; 
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .item-info { flex: 1; padding-right: 20px; }
        .item-name { font-weight: 700; font-size: 1.3rem; display: block; color: var(--black); margin-bottom: 4px; }
        .item-desc { font-size: 1rem; color: var(--black); opacity: 0.9; display: block; font-weight: 600; }
        .item-price { color: var(--black); font-weight: 900; font-size: 1.4rem; white-space: nowrap; }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.5rem; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: rgba(0,0,0,0.6); font-size: 0.9rem; font-weight: bold; }

        @media (max-width: 768px) {
            .bg-image { width: 340px; }
            .img-left { left: -90px; bottom: -20px; }
            .img-right { right: -100px; top: 12%; }
            h1 { font-size: 2.3rem; }
            body { background-attachment: scroll; }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Yükleniyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => { renderMenu(results.data); }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Veri bağlantısı kurulamadı.';
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            const categories = {};
            
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    let priceVal = item['Fiyat (TL)'];
                    if (priceVal === undefined || priceVal === null) priceVal = '---';
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${priceVal}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }
        loadMenu();
    </script>
</body>
</html>
