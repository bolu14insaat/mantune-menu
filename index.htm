<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #2d5a27;
            --green-dark: #1f431b;
            --black: #111111;
            --cream: #f5efe2;
            --box-bg: rgba(245, 240, 230, 0.58);
            --white-soft: rgba(255,255,255,0.84);
            --border-soft: rgba(45,90,39,0.16);
            --shadow: 0 10px 24px rgba(0,0,0,0.08);
            --shadow-strong: 0 16px 34px rgba(0,0,0,0.10);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url('arkaplan.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f1ebd8;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: var(--black);
        }

        .bg-image {
            position: fixed;
            z-index: 1;
            opacity: 1;
            pointer-events: none;
            width: 450px;
            height: auto;
        }

        .img-left {
            bottom: -50px;
            left: -80px;
            transform: rotate(-5deg);
        }

        .img-right {
            top: 8%;
            right: -100px;
            transform: rotate(5deg);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 18px 42px;
            position: relative;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 14px;
            margin-bottom: 6px;
        }

        .menu-note {
            font-size: 0.78rem;
            color: rgba(17,17,17,0.62);
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(45,90,39,0.10);
            padding: 8px 12px;
            border-radius: 999px;
            box-shadow: var(--shadow);
            letter-spacing: 0.2px;
        }

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.82);
            border: 1px solid var(--border-soft);
            border-radius: 999px;
            padding: 6px;
            box-shadow: var(--shadow);
        }

        .lang-btn {
            appearance: none;
            border: none;
            background: transparent;
            color: var(--green);
            padding: 9px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.22s ease, background-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
        }

        .lang-btn:hover {
            transform: translateY(-1px);
        }

        .lang-btn.active {
            background: var(--green);
            color: #fff;
            box-shadow: 0 6px 18px rgba(45,90,39,0.22);
        }

        .flag {
            font-size: 1rem;
            line-height: 1;
        }

        header {
            text-align: center;
            padding: 26px 0 30px;
            animation: fadeDown 0.7s ease;
        }

        .logo-wrap {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.30);
            padding: 18px 24px;
            border-radius: 20px;
        }

        .logo-mark {
            width: 62px;
            height: 62px;
            border: 1.5px solid rgba(45,90,39,0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--green);
            background: rgba(255,255,255,0.58);
            box-shadow: var(--shadow);
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .brand-name {
            font-family: 'Marcellus', serif;
            color: var(--green);
            letter-spacing: 0.36rem;
            text-transform: uppercase;
            margin: 0;
            font-size: 3.4rem;
            line-height: 1;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(255,255,255,0.28);
        }

        .brand-divider {
            width: 110px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--green), transparent);
            border-radius: 999px;
        }

        .tagline {
            color: var(--green-dark);
            margin-top: 2px;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.28rem;
            text-transform: uppercase;
        }

        .quick-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }

        .quick-nav::-webkit-scrollbar {
            display: none;
        }

        .quick-chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(45,90,39,0.14);
            background: rgba(255,255,255,0.80);
            color: var(--green-dark);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .quick-chip:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-strong);
            background: rgba(255,255,255,0.92);
        }

        #loading {
            text-align: center;
            margin-top: 110px;
            color: var(--green);
            font-size: 1.08rem;
            font-weight: 700;
            animation: pulse 1.3s infinite ease-in-out;
        }

        .menu-fade {
            animation: contentFade 0.32s ease;
        }

        .category-section {
            margin-top: 42px;
            scroll-margin-top: 24px;
        }

        .category-title {
            color: var(--green);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.20rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.05rem;
            margin-bottom: 24px;
            font-weight: 700;
            border-bottom: 1.5px solid rgba(45,90,39,0.30);
            padding-bottom: 10px;
            animation: fadeUp 0.45s ease;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            background: var(--box-bg);
            padding: 18px 18px;
            border-radius: 10px;
            border-left: 4px solid var(--green);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: fadeUp 0.42s ease;
        }

        .menu-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.10);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.08rem;
            display: block;
            color: var(--black);
            margin-bottom: 6px;
            letter-spacing: 0.1px;
        }

        .item-desc {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: rgba(17,17,17,0.78);
            display: block;
            font-weight: 500;
            line-height: 1.55;
            white-space: normal;
            word-break: break-word;
        }

        .item-price {
            color: var(--green-dark);
            font-family: 'Cormorant Garamond', serif;
            font-weight: 700;
            font-size: 1.5rem;
            white-space: pre-line;
            text-align: right;
            line-height: 1.1;
            min-width: 96px;
            max-width: 150px;
            flex-shrink: 0;
            letter-spacing: 0.2px;
            padding-top: 1px;
        }

        footer {
            text-align: center;
            padding: 54px 20px 20px;
            color: rgba(0,0,0,0.55);
            font-size: 0.86rem;
            font-weight: 600;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes contentFade {
            from { opacity: 0.15; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.65; }
            50% { opacity: 1; }
            100% { opacity: 0.65; }
        }

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            .container {
                padding: 14px 14px 34px;
            }

            .bg-image {
                width: 280px;
            }

            .img-left {
                bottom: -10px;
                left: -90px;
            }

            .img-right {
                top: 6%;
                right: -90px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .menu-note {
                text-align: center;
            }

            .lang-switch {
                align-self: center;
            }

            header {
                padding: 18px 0 24px;
            }

            .logo-wrap {
                padding: 16px 18px;
                gap: 8px;
            }

            .logo-mark {
                width: 54px;
                height: 54px;
                font-size: 1.45rem;
            }

            .brand-name {
                font-size: 2.55rem;
                letter-spacing: 0.18rem;
            }

            .brand-divider {
                width: 84px;
            }

            .tagline {
                font-size: 0.76rem;
                letter-spacing: 0.16rem;
                line-height: 1.4;
            }

            .quick-nav {
                padding-bottom: 8px;
                margin-bottom: 8px;
            }

            .quick-chip {
                padding: 9px 12px;
                font-size: 0.82rem;
            }

            .category-title {
                font-size: 1.65rem;
                letter-spacing: 0.12rem;
                margin-bottom: 18px;
            }

            .menu-item {
                padding: 15px 15px;
                gap: 12px;
            }

            .item-name {
                font-size: 1rem;
            }

            .item-desc {
                font-size: 0.89rem;
                line-height: 1.5;
            }

            .item-price {
                min-width: 76px;
                max-width: 100px;
                font-size: 1.22rem;
            }
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="manti.png" class="bg-image img-right" alt="Mantı">

    <div class="container">
        <div class="top-bar">
            <div class="menu-note" id="menu-note">QR Menü • Hızlı Erişim</div>

            <div class="lang-switch" aria-label="Dil seçici">
                <button id="btn-tr" class="lang-btn active" type="button" onclick="setLang('tr')">
                    <span class="flag">🇹🇷</span>
                    <span>TR</span>
                </button>
                <button id="btn-en" class="lang-btn" type="button" onclick="setLang('en')">
                    <span class="flag">🇬🇧</span>
                    <span>EN</span>
                </button>
            </div>
        </div>

        <header>
            <div class="logo-wrap">
                <div class="logo-mark">M</div>
                <h1 class="brand-name" id="main-title">MANTUNE</h1>
                <div class="brand-divider"></div>
                <div class="tagline" id="main-tagline">Bolu'nun Geleneksel Lezzeti</div>
            </div>
        </header>

        <div id="quick-nav" class="quick-nav"></div>

        <div id="loading">Menü Yükleniyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        let currentLang = localStorage.getItem('mantune_lang') || 'tr';
        let menuData = [];

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function cleanValue(value) {
            if (value === undefined || value === null) return '';
            return String(value).trim();
        }

        function slugify(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/ğ/g, 'g')
                .replace(/ü/g, 'u')
                .replace(/ş/g, 's')
                .replace(/ı/g, 'i')
                .replace(/ö/g, 'o')
                .replace(/ç/g, 'c')
                .replace(/[^a-z0-9\s-]/g, '')
                .trim()
                .replace(/\s+/g, '-');
        }

        function getLocalizedValue(item, trKey, enKey) {
            const trValue = cleanValue(item[trKey]);
            const enValue = cleanValue(item[enKey]);

            if (currentLang === 'en') {
                return enValue || trValue || '';
            }
            return trValue || enValue || '';
        }

        function getLocalizedCategory(item) {
            return getLocalizedValue(item, 'Menü Kategorisi', 'Menu Category EN');
        }

        function getLocalizedName(item) {
            return getLocalizedValue(item, 'Ürün Adı', 'Product Name EN');
        }

        function getLocalizedDescription(item) {
            return getLocalizedValue(item, 'Açıklama', 'Description EN');
        }

        function getLocalizedPrice(item) {
            return getLocalizedValue(item, 'Fiyat (TL)', 'Price (TL)');
        }

        function updateStaticTexts() {
            const title = document.getElementById('main-title');
            const tagline = document.getElementById('main-tagline');
            const loading = document.getElementById('loading');
            const menuNote = document.getElementById('menu-note');

            if (currentLang === 'en') {
                document.documentElement.lang = 'en';
                title.textContent = 'MANTUNE';
                tagline.textContent = 'Traditional Taste of Bolu';
                menuNote.textContent = 'QR Menu • Quick Access';
                if (loading.style.display !== 'none') {
                    loading.textContent = 'Loading menu...';
                }
            } else {
                document.documentElement.lang = 'tr';
                title.textContent = 'MANTUNE';
                tagline.textContent = "Bolu'nun Geleneksel Lezzeti";
                menuNote.textContent = 'QR Menü • Hızlı Erişim';
                if (loading.style.display !== 'none') {
                    loading.textContent = 'Menü Yükleniyor...';
                }
            }

            document.getElementById('btn-tr').classList.toggle('active', currentLang === 'tr');
            document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('mantune_lang', lang);
            updateStaticTexts();
            renderMenu(menuData, true);
        }

        async function loadMenu() {
            try {
                updateStaticTexts();

                const response = await fetch(sheetUrl);
                const csvData = await response.text();

                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: false,
                    complete: (results) => {
                        menuData = results.data || [];
                        renderMenu(menuData, false);
                    },
                    error: () => {
                        const loading = document.getElementById('loading');
                        loading.style.display = 'block';
                        loading.textContent = currentLang === 'en'
                            ? 'Data parsing error.'
                            : 'Veri ayrıştırma hatası.';
                    }
                });
            } catch (error) {
                const loading = document.getElementById('loading');
                loading.style.display = 'block';
                loading.textContent = currentLang === 'en'
                    ? 'Data connection error.'
                    : 'Veri bağlantı hatası.';
            }
        }

        function renderQuickNav(categoryOrder) {
            const nav = document.getElementById('quick-nav');

            if (!categoryOrder.length) {
                nav.innerHTML = '';
                return;
            }

            nav.innerHTML = categoryOrder.map(category => {
                const id = 'cat-' + slugify(category);
                return `<a class="quick-chip" href="#${id}">${escapeHtml(category)}</a>`;
            }).join('');
        }

        function renderMenu(data, animate = true) {
            const content = document.getElementById('menu-content');
            const loading = document.getElementById('loading');

            loading.style.display = 'none';

            const categories = {};
            const categoryOrder = [];

            data.forEach(item => {
                const localizedCategory = getLocalizedCategory(item);
                const localizedName = getLocalizedName(item);

                if (!localizedCategory || !localizedName) return;

                if (!categories[localizedCategory]) {
                    categories[localizedCategory] = [];
                    categoryOrder.push(localizedCategory);
                }

                categories[localizedCategory].push(item);
            });

            renderQuickNav(categoryOrder);

            let fullHtml = '';

            categoryOrder.forEach(category => {
                const items = categories[category];
                const categoryId = 'cat-' + slugify(category);

                let catHtml = `
                    <section class="category-section" id="${escapeHtml(categoryId)}">
                        <h2 class="category-title">${escapeHtml(category)}</h2>
                        <div class="menu-list">
                `;

                items.forEach(item => {
                    const name = getLocalizedName(item);
                    const desc = getLocalizedDescription(item);
                    const price = getLocalizedPrice(item);

                    if (!name) return;

                    catHtml += `
                        <article class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${escapeHtml(name)}</span>
                                ${desc ? `<span class="item-desc">${escapeHtml(desc)}</span>` : ''}
                            </div>
                            <div class="item-price">${escapeHtml(price)}</div>
                        </article>
                    `;
                });

                catHtml += `
                        </div>
                    </section>
                `;

                fullHtml += catHtml;
            });

            content.innerHTML = fullHtml || `
                <div id="loading" style="display:block; margin-top: 80px;">
                    ${currentLang === 'en' ? 'No menu data found.' : 'Menü verisi bulunamadı.'}
                </div>
            `;

            if (animate) {
                content.classList.remove('menu-fade');
                void content.offsetWidth;
                content.classList.add('menu-fade');
            }
        }

        updateStaticTexts();
        loadMenu();
    </script>
</body>
</html>
