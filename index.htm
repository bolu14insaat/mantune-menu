<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Dijital Menü</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --red: #ff3131;    
            --yellow: #ffde59; 
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* GÖRSELLER - Tam Opak ve Ekranda Çakılı */
        .bg-image {
            position: fixed;
            z-index: 1; 
            opacity: 1; 
            pointer-events: none;
            width: 500px; 
            height: auto;
        }

        .img-left { bottom: -50px; left: -100px; transform: rotate(-10deg); }
        .img-right { top: 5%; right: -120px; transform: rotate(10deg); }

        /* YAZI ALANI - Gölgeler kaldırıldı, yazılar tertemiz */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            position: relative; 
            z-index: 10; 
            background: transparent; 
        }

        header { text-align: center; padding: 60px 0; margin-bottom: 20px; }
        h1 { 
            color: var(--red); 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin: 0; 
            font-size: 3rem; 
            font-weight: 900;
        }
        .tagline { color: var(--yellow); font-style: italic; margin-top: 10px; font-size: 1.2rem; }
        
        .category-section { margin-top: 40px; }
        .category-title { 
            color: var(--red); 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 30px; 
            padding: 10px;
            /* Resimler arkadan belli olsun diye şeffaf siyah şerit */
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 8px;
        }

        .item-info { flex: 1; padding-right: 20px; }
        .item-name { 
            font-weight: 700; 
            font-size: 1.3rem; 
            display: block; 
            color: var(--yellow); 
        }
        .item-desc { 
            font-size: 1rem; 
            color: #ffffff; 
            opacity: 0.9; 
            display: block; 
            font-weight: 400;
        }
        
        .item-price { 
            color: var(--yellow); 
            font-weight: 900; 
            font-size: 1.4rem; 
            white-space: nowrap; 
        }

        #loading { text-align: center; margin-top: 150px; color: var(--red); font-size: 1.5rem; }
        footer { text-align: center; padding: 60px; color: #555; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .bg-image { width: 320px; }
            .img-left { left: -80px; bottom: 0; }
            .img-right { right: -80px; top: 10%; }
            h1 { font-size: 2.2rem; }
            .menu-item { background: rgba(0, 0, 0, 0.6); } 
        }
    </style>
</head>
<body>

    <img src="manti.png" class="bg-image img-left" alt="Mantı">
    <img src="gozleme.png" class="bg-image img-right" alt="Gözleme">

    <div class="container">
        <header>
            <h1>MANTUNE</h1>
            <div class="tagline">Mantı • Gözleme • Ev Yemekleri</div>
        </header>
        
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu. Tüm hakları saklıdır.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => { renderMenu(results.data); }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Hata oluştu.';
            }
        }

        function renderMenu(data) {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            const categories = {};
            
            data.forEach(item => {
                const cat = item['Menü Kategorisi']?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            let fullHtml = '';
            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item['Ürün Adı'] || '';
                    const desc = item['Açıklama'] || '';
                    // Fiyatı string olarak alıyoruz, böylece 150-250 gibi değerler bozulmuyor
                    const price = String(item['Fiyat (TL)'] || '').trim();
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">₺${price}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                fullHtml += catHtml;
            }
            content.innerHTML = fullHtml;
        }
        loadMenu();
    </script>
</body>
</html>
