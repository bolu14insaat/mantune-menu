<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantune - Digital Menu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --green: #2d5a27;    
            --black: #000000;    
            --box-bg: rgba(245, 240, 230, 0.5); 
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-image: url('arkaplan.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f1ebd8; 
            margin: 0; padding: 0; min-height: 100vh;
        }

        /* DİL BUTONU STİLİ */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .lang-btn:hover { transform: scale(1.1); }

        .container { max-width: 650px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        header { text-align: center; padding: 70px 0; }
        h1 { font-family: 'Playfair Display', serif; color: var(--green); letter-spacing: 12px; text-transform: uppercase; margin: 0; font-size: 4rem; font-weight: 900; }
        .tagline { color: var(--green); margin-top: 15px; font-size: 1.1rem; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }
        
        .category-section { margin-top: 60px; }
        .category-title { color: var(--green); text-align: center; text-transform: uppercase; letter-spacing: 4px; font-size: 1.8rem; margin-bottom: 35px; font-weight: 700; border-bottom: 2px solid var(--green); padding-bottom: 10px; }

        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; background: var(--box-bg); padding: 20px; border-radius: 4px; border-left: 5px solid var(--green); }
        .item-info { flex: 1; padding-right: 20px; }
        .item-name { font-weight: 700; font-size: 1.3rem; display: block; color: var(--black); margin-bottom: 4px; }
        .item-desc { font-family: 'Caveat', cursive; font-size: 1.5rem; color: #222; display: block; font-weight: 400; line-height: 1.2; }
        .item-price { color: var(--black); font-weight: 900; font-size: 1.5rem; white-space: nowrap; margin-left: 10px; }

        #loading { text-align: center; margin-top: 150px; color: var(--green); font-size: 1.5rem; font-weight: bold; }
        footer { text-align: center; padding: 60px; color: rgba(0,0,0,0.5); font-size: 0.9rem; font-weight: 700; }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 6px; }
            .lang-switcher { top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="lang-btn" onclick="switchLang('tr')">TR</button>
        <button class="lang-btn" onclick="switchLang('en')">EN</button>
    </div>

    <div class="container">
        <header>
            <h1 id="main-title">MANTUNE</h1>
            <div id="tagline" class="tagline">Bolu'nun Geleneksel Lezzeti</div>
        </header>
        
        <div id="loading">Yükleniyor... / Loading...</div>
        <div id="menu-content"></div>

        <footer>
            &copy; 2026 Mantune Bolu.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1tGMLWyasdCc-FNUF2-iDNHfC0iMjn-ir3FhJizpT0BU/gviz/tq?tqx=out:csv';
        let currentLang = 'tr';
        let menuData = [];

        const translations = {
            tr: { loading: "Menü Hazırlanıyor...", tagline: "Bolu'nun Geleneksel Lezzeti" },
            en: { loading: "Preparing Menu...", tagline: "Traditional Taste of Bolu" }
        };

        async function loadMenu() {
            try {
                const response = await fetch(sheetUrl);
                const csvData = await response.text();
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: false,
                    complete: (results) => { 
                        menuData = results.data;
                        renderMenu(); 
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Hata! / Error!';
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('tagline').innerText = translations[lang].tagline;
            renderMenu();
        }

        function renderMenu() {
            const content = document.getElementById('menu-content');
            document.getElementById('loading').style.display = 'none';
            content.innerHTML = '';
            
            const categories = {};
            
            // Dil seçimine göre sütun isimlerini belirliyoruz
            const colCategory = currentLang === 'tr' ? 'Menü Kategorisi' : 'Category EN';
            const colName = currentLang === 'tr' ? 'Ürün Adı' : 'Product Name EN';
            const colDesc = currentLang === 'tr' ? 'Açıklama' : 'Description EN';
            const colPrice = currentLang === 'tr' ? 'Fiyat (TL)' : 'Price EN';

            menuData.forEach(item => {
                const cat = item[colCategory]?.trim();
                if (!cat) return;
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(item);
            });

            for (const [category, items] of Object.entries(categories)) {
                let catHtml = `<div class="category-section"><h2 class="category-title">${category}</h2>`;
                items.forEach(item => {
                    const name = item[colName] || '';
                    const desc = item[colDesc] || '';
                    const price = item[colPrice] || '';
                    
                    if(!name) return;
                    catHtml += `
                        <div class="menu-item">
                            <div class="item-info">
                                <span class="item-name">${name}</span>
                                <span class="item-desc">${desc}</span>
                            </div>
                            <div class="item-price">${price}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                content.innerHTML += catHtml;
            }
        }
        loadMenu();
    </script>
</body>
</html>
